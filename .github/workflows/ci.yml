name: Hosted validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x86_64
            smoke: check
          - runner: macos-15
            label: macOS Apple Silicon
            smoke: run
          - runner: macos-15-intel
            label: macOS Intel
            smoke: run
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Deno 2.9.7
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Verify repository
        run: bash ci/check.sh
      - name: Compile source
        run: deno task compile
      - name: Check compiled CLI on Linux
        if: matrix.smoke == 'check'
        run: ./dist/mci check examples/basic.yml --job check
      - name: Run compiled CLI on macOS
        if: matrix.smoke == 'run'
        run: ./dist/mci run examples/basic.yml --job check
